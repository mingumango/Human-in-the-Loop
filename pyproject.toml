[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hitl-experiments"
version = "0.1.0"
description = "Reusable runners for HITL step-by-step reasoning experiments."
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
hitl-run = "hitl.run_experiments:main"

[tool.setuptools.packages.find]
where = ["src"]
